services:
  - type: web
    name: gharkhata
    runtime: python
    plan: free
    buildCommand: bash render-build.sh
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: COOKIE_SECURE
        value: 'true'
      - key: TRUST_PROXY_HEADERS
        value: 'false'
      - key: CORS_ORIGINS
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
